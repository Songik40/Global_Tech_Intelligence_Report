name: Report pipeline checks
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'automation/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify the latest published report on the GitHub runner
        run: python3 scripts/report_pipeline.py verify-existing --out run-output
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipeline-checks-${{ github.run_id }}
          path: run-output/
          if-no-files-found: ignore
          retention-days: 30
