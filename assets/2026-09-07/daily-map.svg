<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">2026-09-07 Global Tech Intelligence Overview</title>
  <desc id="desc">Five verified developments across finance, robotics, space commercialization and energy.</desc>
  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="800" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#111827">2026-09-07 Global Tech Intelligence</text>
  <text x="800" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#4b5563">capital × robotics execution × launch cadence × energy conditions</text>

  <g font-family="Arial, sans-serif">
    <rect x="80" y="170" width="440" height="185" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <text x="110" y="215" font-size="24" font-weight="700" fill="#111827">1 · China financial recapitalization</text>
    <text x="110" y="255" font-size="21" fill="#374151">~$54B capital support for state banks</text>
    <text x="110" y="287" font-size="21" fill="#374151">and insurers; balance-sheet capacity rises.</text>
    <text x="110" y="326" font-size="18" fill="#6b7280">Signal: financing capacity matters for infrastructure.</text>

    <rect x="580" y="170" width="440" height="185" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <text x="610" y="215" font-size="24" font-weight="700" fill="#111827">2 · Atoms robotaxi signal</text>
    <text x="610" y="255" font-size="21" fill="#374151">FT reports development activity; company</text>
    <text x="610" y="287" font-size="21" fill="#374151">publicly denies a robotaxi market entry plan.</text>
    <text x="610" y="326" font-size="18" fill="#6b7280">Signal: capability evidence ≠ commercial launch.</text>

    <rect x="1080" y="170" width="440" height="185" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <text x="1110" y="215" font-size="24" font-weight="700" fill="#111827">3 · Roborock H1 execution</text>
    <text x="1110" y="255" font-size="21" fill="#374151">Revenue +27.6%; net profit +45.6%;</text>
    <text x="1110" y="287" font-size="21" fill="#374151">R&amp;D RMB 720M across home robotics.</text>
    <text x="1110" y="326" font-size="18" fill="#6b7280">Signal: robotics value measured in repeat revenue.</text>

    <rect x="330" y="420" width="440" height="185" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <text x="360" y="465" font-size="24" font-weight="700" fill="#111827">4 · SpaceX Starlink cadence</text>
    <text x="360" y="505" font-size="21" fill="#374151">27 satellites deployed from Vandenberg;</text>
    <text x="360" y="537" font-size="21" fill="#374151">high-frequency 2026 launch rhythm continues.</text>
    <text x="360" y="576" font-size="18" fill="#6b7280">Signal: throughput is a commercialization moat.</text>

    <rect x="830" y="420" width="440" height="185" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <text x="860" y="465" font-size="24" font-weight="700" fill="#111827">5 · OPEC+ holds October policy</text>
    <text x="860" y="505" font-size="21" fill="#374151">Seven members keep September required</text>
    <text x="860" y="537" font-size="21" fill="#374151">production levels for October.</text>
    <text x="860" y="576" font-size="18" fill="#6b7280">Signal: energy conditions remain a capital input.</text>

    <line x1="800" y1="355" x2="800" y2="390" stroke="#94a3b8" stroke-width="4"/>
    <text x="800" y="690" text-anchor="middle" font-size="23" font-weight="700" fill="#111827">Operating thesis: frontier technology wins through repeatable execution, not demos alone.</text>
    <text x="800" y="726" text-anchor="middle" font-size="17" fill="#6b7280">Repository-created SVG · see source ledger for evidence and uncertainty notes</text>
  </g>
</svg>
