<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">실현 실적과 금융 위험을 구분해 읽기</title><desc id="desc">TSMC의 분기 매출, 미국의 생산자물가, 한국 코스피의 시장 반응을 개별 증거로 나란히 배치했다. 세 항목 사이의 인과관계는 주장하지 않는다.</desc>
<rect width="1200" height="570" rx="24" fill="#101b2d"/>
<g font-family="Arial, Apple SD Gothic Neo, sans-serif">
<text x="56" y="67" fill="#8fb8d8" font-size="20">GLOBAL TECH INTELLIGENCE · 2026-10-16</text>
<text x="56" y="120" fill="#ffffff" font-size="36" font-weight="700">실현 실적과 금융 위험을 구분해 읽기</text>
<text x="56" y="163" fill="#c8d6e5" font-size="21">측정 대상과 시점이 다른 세 가지 증거</text>
<rect x="56" y="205" width="344" height="243" rx="16" fill="#203a4a"/>
<rect x="428" y="205" width="344" height="243" rx="16" fill="#363146"/>
<rect x="800" y="205" width="344" height="243" rx="16" fill="#42303b"/>
<text x="80" y="250" fill="#8de0ca" font-size="22">TSMC · 분기 실현 매출</text>
<text x="80" y="315" fill="#ffffff" font-size="43" font-weight="700">US$46.72B</text>
<text x="80" y="361" fill="#d3e2ed" font-size="21">2026년 3분기 실제 실적</text>
<text x="80" y="401" fill="#d3e2ed" font-size="19">고객의 AI 투자수익률과 구분</text>
<text x="452" y="250" fill="#c7b5f1" font-size="22">미국 PPI · 월간 물가</text>
<text x="452" y="315" fill="#ffffff" font-size="43" font-weight="700">+1.3% m/m</text>
<text x="452" y="361" fill="#e0d9ed" font-size="21">9월 최종수요 · 계절조정</text>
<text x="452" y="401" fill="#e0d9ed" font-size="19">개별 데이터센터 원가와 구분</text>
<text x="824" y="250" fill="#f3b8be" font-size="22">코스피 · 일간 시장 반응</text>
<text x="824" y="315" fill="#ffffff" font-size="43" font-weight="700">−7.57%</text>
<text x="824" y="361" fill="#efd9dc" font-size="21">10월 15일 · 5,554.22 종가</text>
<text x="824" y="401" fill="#efd9dc" font-size="19">실수요 붕괴로 단정하지 않음</text>
<text x="56" y="499" fill="#ffffff" font-size="22">직접 인과를 표시하지 않은 설명 도표 · 현장 사진이나 예측 모델이 아님</text>
<text x="56" y="538" fill="#a9bed0" font-size="18">근거: TSMC IR · BLS / US DOL · Reuters (MarketScreener 전재) · 자체 제작, CC BY 4.0</text>
</g></svg>
