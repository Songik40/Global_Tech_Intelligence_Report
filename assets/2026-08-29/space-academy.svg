<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect width="1200" height="420" fill="#fff"/><text x="60" y="68" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#111">Space capacity is also a workforce problem</text><text x="60" y="106" font-family="Arial,sans-serif" font-size="18" fill="#555">The proposed U.S. Space Academy targets a long-term pipeline of technical talent.</text><g font-family="Arial,sans-serif"><rect x="75" y="170" width="240" height="105" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="195" y="214" text-anchor="middle" font-size="22" font-weight="700">Education</text><text x="195" y="245" text-anchor="middle" font-size="16" fill="#444">technical training</text><rect x="480" y="170" width="240" height="105" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="600" y="214" text-anchor="middle" font-size="22" font-weight="700">Workforce</text><text x="600" y="245" text-anchor="middle" font-size="16" fill="#444">scientists · engineers</text><rect x="885" y="170" width="240" height="105" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1005" y="214" text-anchor="middle" font-size="22" font-weight="700">Space systems</text><text x="1005" y="245" text-anchor="middle" font-size="16" fill="#444">civil · commercial</text><path d="M315 222 H480" stroke="#333" stroke-width="3"/><path d="M720 222 H885" stroke="#333" stroke-width="3"/></g><text x="60" y="350" font-family="Arial,sans-serif" font-size="18" fill="#333">Watch: commission design, legislative action, funding and the final institutional model.</text></svg>