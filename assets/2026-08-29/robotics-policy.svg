<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect width="1200" height="420" fill="#fff"/><text x="60" y="68" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#111">Robotics policy: from rush to disciplined deployment</text><text x="60" y="106" font-family="Arial,sans-serif" font-size="18" fill="#555">China's planner signaled local fit, real demand and orderly development.</text><g font-family="Arial,sans-serif"><rect x="70" y="170" width="240" height="105" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="190" y="214" text-anchor="middle" font-size="22" font-weight="700">Hype</text><text x="190" y="245" text-anchor="middle" font-size="16" fill="#444">blind capacity build</text><rect x="480" y="170" width="240" height="105" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="600" y="214" text-anchor="middle" font-size="22" font-weight="700">Local fit</text><text x="600" y="245" text-anchor="middle" font-size="16" fill="#444">industrial strengths</text><rect x="890" y="170" width="240" height="105" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="1010" y="214" text-anchor="middle" font-size="22" font-weight="700">Deployment</text><text x="1010" y="245" text-anchor="middle" font-size="16" fill="#444">real-world validation</text><path d="M310 222 H480" stroke="#333" stroke-width="3"/><path d="M720 222 H890" stroke="#333" stroke-width="3"/></g><text x="60" y="350" font-family="Arial,sans-serif" font-size="18" fill="#333">Signal: policy attention is shifting toward commercial fit, reliability and real-machine data.</text></svg>