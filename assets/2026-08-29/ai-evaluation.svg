<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect width="1200" height="420" fill="#fff"/><text x="60" y="68" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#111">Evaluating AI evaluators</text><text x="60" y="106" font-family="Arial,sans-serif" font-size="18" fill="#555">TASTE compares model judgments with experienced human researchers.</text><g font-family="Arial,sans-serif"><rect x="90" y="175" width="280" height="105" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="230" y="218" text-anchor="middle" font-size="22" font-weight="700">Research proposals</text><text x="230" y="248" text-anchor="middle" font-size="16" fill="#444">paired comparisons</text><rect x="460" y="175" width="280" height="105" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="600" y="218" text-anchor="middle" font-size="22" font-weight="700">Human judgment</text><text x="600" y="248" text-anchor="middle" font-size="16" fill="#444">experienced researchers</text><rect x="830" y="175" width="280" height="105" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="970" y="218" text-anchor="middle" font-size="22" font-weight="700">Model judgment</text><text x="970" y="248" text-anchor="middle" font-size="16" fill="#444">agreement benchmark</text><path d="M370 227 H460" stroke="#333" stroke-width="3"/><path d="M740 227 H830" stroke="#333" stroke-width="3"/></g><text x="60" y="350" font-family="Arial,sans-serif" font-size="18" fill="#333">Finding: benchmark construction can be as important as the model score itself.</text></svg>