<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">글로벌 테크 인텔리전스 2026-10-15: 증거 단계</title>
<desc id="desc">미국 CPI와 시장 거래, ASML 실제 실적 및 전망, Kosmo 제품 출시, 두 연구의 정식 출판을 구분한 자체 설명 도표. 인과관계나 독립 성능 입증을 뜻하지 않는다.</desc>
<rect width="1200" height="700" rx="26" fill="#101c2e"/>
<text x="55" y="68" fill="#f0f5ff" font-family="sans-serif" font-size="34" font-weight="700">AI 산업: 실현된 증거와 다음 검증</text>
<text x="55" y="110" fill="#acbdd4" font-family="sans-serif" font-size="21">2026-10-15 · 원 컷오프 08:45:27 KST · 자체 설명 도표</text>
<rect x="45" y="150" width="1110" height="83" rx="14" fill="#1c304c"/>
<text x="65" y="183" fill="#80d7d0" font-family="sans-serif" font-size="23" font-weight="700">01  미국 CPI · 시장 거래</text>
<text x="65" y="215" fill="#e9f0fb" font-family="sans-serif" font-size="21">공식 통계·실제 가격 반응 → 금리·자본조달 경로를 관찰</text>
<rect x="45" y="245" width="1110" height="83" rx="14" fill="#1c304c"/>
<text x="65" y="278" fill="#80d7d0" font-family="sans-serif" font-size="23" font-weight="700">02  ASML 분기 실적 · 전망</text>
<text x="65" y="310" fill="#e9f0fb" font-family="sans-serif" font-size="21">실현 매출과 미래 가이던스 분리 → 공급능력·매출 전환을 관찰</text>
<rect x="45" y="340" width="1110" height="83" rx="14" fill="#1c304c"/>
<text x="65" y="373" fill="#80d7d0" font-family="sans-serif" font-size="23" font-weight="700">03  Hesai Kosmo 제품 출시</text>
<text x="65" y="405" fill="#e9f0fb" font-family="sans-serif" font-size="21">실공간 데이터 제품화 발표 → 독립적인 로봇 검증을 관찰</text>
<rect x="45" y="435" width="1110" height="83" rx="14" fill="#1c304c"/>
<text x="65" y="468" fill="#80d7d0" font-family="sans-serif" font-size="23" font-weight="700">04  PBC 기상예측 · Nature</text>
<text x="65" y="500" fill="#e9f0fb" font-family="sans-serif" font-size="21">동료심사 출판·과거 평가 → 독립 재현·운영 적용을 관찰</text>
<rect x="45" y="530" width="1110" height="83" rx="14" fill="#1c304c"/>
<text x="65" y="563" fill="#80d7d0" font-family="sans-serif" font-size="23" font-weight="700">05  메카트로닉 메타물질 · Nature</text>
<text x="65" y="595" fill="#e9f0fb" font-family="sans-serif" font-size="21">1D·2D 실험·정식 출판 → 확장·응용·재현을 관찰</text>
<text x="55" y="660" fill="#acbdd4" font-family="sans-serif" font-size="18">화살표는 다음 관찰 대상을 뜻함 · 입증된 인과·실측 성능 그래프 아님 · CC BY 4.0</text>
</svg>
