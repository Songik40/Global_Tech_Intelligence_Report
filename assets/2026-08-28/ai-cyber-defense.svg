<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><rect width="1200" height="430" fill="#fff"/><text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111">AI Cybersecurity: Capability Scales Both Sides</text><text x="60" y="108" font-family="Arial, sans-serif" font-size="19" fill="#555">The open letter argues for a defensive surge before attacker capability scales further.</text><g font-family="Arial, sans-serif"><rect x="80" y="170" width="310" height="140" rx="18" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="235" y="215" text-anchor="middle" font-size="24" font-weight="700">Attack automation</text><text x="235" y="252" text-anchor="middle" font-size="17" fill="#444">recon · exploit discovery</text><text x="235" y="280" text-anchor="middle" font-size="17" fill="#444">social engineering · scale</text><rect x="445" y="185" width="310" height="110" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="600" y="230" text-anchor="middle" font-size="24" font-weight="700">AI capability</text><text x="600" y="263" text-anchor="middle" font-size="17" fill="#444">more capable models</text><rect x="810" y="170" width="310" height="140" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="965" y="215" text-anchor="middle" font-size="24" font-weight="700">Defense automation</text><text x="965" y="252" text-anchor="middle" font-size="17" fill="#444">triage · patching · detection</text><text x="965" y="280" text-anchor="middle" font-size="17" fill="#444">knowledge sharing · response</text><path d="M445 240 H390" stroke="#333" stroke-width="3" marker-end="url(#l)"/><path d="M755 240 H810" stroke="#333" stroke-width="3" marker-end="url(#r)"/><text x="60" y="370" font-size="18" fill="#333">Editorial note: the predicted surge in future attacks is a forward-looking warning, not an observed future fact.</text></g><defs><marker id="l" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9,0 L9,6 L0,3 z" fill="#333"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs></svg>