s</text></g><g transform="translate(413,250)"><rect width="220" height="105" rx="16" fill="#fff" stroke="#bbb"/><text x="18" y="30" font-size="14" font-weight="700">SCIENCE</text><text x="18" y="56" font-size="18">β Pictoris b</text><text x="18" y="80" font-size="13" fill="#555">radio emission · magnetic field</text></g><text x="400" y="395" text-anchor="middle" font-size="14" fill="#444">Structural signal: capability matters increasingly through integration, economics and verification.</text></g></svg>